<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta marítima del regreso | JJAM Travel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap');

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #F4F4F9;
            color: #26364A;
            font-family: "DM Sans", sans-serif;
        }

        header {
            background: #17365D;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            margin: 0;
            font-family: "Bebas Neue", sans-serif;
            letter-spacing: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        main {
            width: min(1000px, calc(100% - 32px));
            margin: 32px auto 48px;
        }

        .hero {
            min-height: 420px;
            display: flex;
            align-items: end;
            padding: 32px;
            box-sizing: border-box;
            border-radius: 8px;
            background:
                linear-gradient(180deg, rgba(23, 54, 93, 0.08), rgba(23, 54, 93, 0.85)),
                url("https://images.pexels.com/photos/35521708/pexels-photo-35521708.jpeg?auto=compress&cs=tinysrgb&w=1600") center 58% / cover;
            color: white;
        }

        .hero h2 {
            max-width: 760px;
            margin: 0;
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(42px, 8vw, 76px);
            line-height: 0.95;
            letter-spacing: 0;
        }

        .package-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .summary-item {
            border-left: 4px solid #17365D;
            padding: 8px 16px;
            background: white;
        }

        .summary-item strong,
        .summary-item span {
            display: block;
        }

        .summary-item strong {
            color: #17365D;
            font-size: 14px;
            text-transform: uppercase;
        }

        .summary-item span {
            margin-top: 4px;
            font-size: 22px;
            font-weight: 600;
        }

        article {
            background: white;
            padding: clamp(24px, 5vw, 48px);
            border-radius: 8px;
        }

        article h3 {
            margin-top: 0;
            color: #17365D;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            .hero {
                min-height: 330px;
                padding: 20px;
            }

            .package-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>JJAM TRAVEL™</h1>
        <a href="JJAMTRAVEL.html">← Volver</a>
    </header>

    <main>
        <div class="hero">
            <h2>Ruta marítima del regreso (2027)</h2>
        </div>

        <div class="package-summary">
            <div class="summary-item">
                <strong>Duración</strong>
                <span>12 noches</span>
            </div>
            <div class="summary-item">
                <strong>Precio</strong>
                <span>$3,000–$8,000 USD</span>
            </div>
        </div>

        <article>
            <h3>China · Sumatra · Sri Lanka · India · Persia</h3>
            <p>
                ¡Embárcate en un viaje marítimo que pasa por China, la actual Sumatra, la isla de Sri Lanka y por India y Persia!
            </p>
        </article>
    </main>
</body>
</html>
